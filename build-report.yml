name: Сборка отчёта по полевым работам

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'docs/index.html'
      - '.github/workflows/build-report.yml'
  schedule:
    # 15:00 UTC = 18:00 МСК, после сдачи вечерней сводки
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Отчётная дата ГГГГ-ММ-ДД (пусто = последний день с выработкой)'
        required: false
        default: ''

permissions:
  contents: write      # архив отчётов коммитится обратно в репозиторий
  pages: write
  id-token: write

concurrency:
  group: agro-report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.build.outputs.report_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить, что файлы проекта на месте
        run: |
          echo "--- Состав репозитория ---"
          ls -la
          MISS=0
          for f in "scripts/requirements.txt" "scripts/parse_svod.py" "scripts/build_report.py" "docs/index.html" "data/ПланФакт2026.xlsm"; do
            if [ ! -f "$f" ]; then echo "НЕ НАЙДЕН: $f"; MISS=1; fi
          done
          if [ "$MISS" = "1" ]; then
            echo ""
            echo "Загрузите в репозиторий содержимое папки agro-report целиком:"
            echo "Add file -> Upload files -> перетащить папки data, docs, scripts, reports."
            exit 1
          fi
          echo "Все файлы на месте."

      - name: Установить зависимости
        run: pip install -r scripts/requirements.txt

      - name: Собрать data.json и otchet.xlsx
        id: build
        run: |
          python scripts/build_report.py \
            --src "data/ПланФакт2026.xlsm" \
            --out docs \
            ${{ github.event.inputs.report_date && format('--date {0}', github.event.inputs.report_date) || '' }}
          DATE=$(python -c "import json;print(json.load(open('docs/data.json'))['meta']['reportDate'])")
          echo "report_date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Проверить, что отчёт не пустой
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('docs/data.json'))
          assert m['ops'], 'В отчёте нет ни одного вида работ — проверьте лист «Общий свод 2026»'
          assert m['totals']['plan'] > 0, 'Суммарный план равен нулю'
          print('OK:', len(m['ops']), 'видов работ,', m['totals']['plan'], 'га плана')
          PY

      - name: Положить копию в архив отчётов
        run: |
          mkdir -p reports
          cp docs/otchet.xlsx "reports/otchet_${{ steps.build.outputs.report_date }}.xlsx"

      - name: Зафиксировать результат в репозитории
        run: |
          git config user.name  'agro-report bot'
          git config user.email 'actions@github.com'
          git add docs/data.json docs/otchet.xlsx reports/
          git diff --staged --quiet || git commit -m "Отчёт на ${{ steps.build.outputs.report_date }}"
          git push

      - name: Отчёт как артефакт запуска
        uses: actions/upload-artifact@v4
        with:
          name: otchet-${{ steps.build.outputs.report_date }}
          path: docs/otchet.xlsx
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - run: echo "Отчёт на ${{ needs.build.outputs.report_date }} опубликован — ${{ steps.pages.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
