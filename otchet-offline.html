<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16211C">
<title>План-факт полевых работ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16211C; --paper:#E8EAE3; --card:#FCFCFA; --line:#D3D8CC;
  --leaf:#2E6B41; --straw:#B57E0C; --clay:#A63D28; --mute:#6B7469;
  --shadow:0 1px 0 rgba(22,33,28,.06), 0 6px 18px -12px rgba(22,33,28,.35);
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:400 15px/1.45 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:"Oswald",Impact,sans-serif;font-weight:500;letter-spacing:.01em;margin:0}

/* ---------- шапка ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--ink);color:#EEF1EA;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 0;
}
.head-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.head-top h1{font-size:19px;text-transform:uppercase;letter-spacing:.06em}
.head-top .date{font-size:12.5px;color:#A9B5A6}
.kpi{display:flex;gap:8px;padding:12px 0 10px;overflow-x:auto;scrollbar-width:none}
.kpi::-webkit-scrollbar{display:none}
.kpi div{flex:0 0 auto;min-width:88px;padding:7px 11px;border:1px solid rgba(255,255,255,.16);border-radius:10px}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;line-height:1.15}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#9DAB9C}
/* вкладки */
.tabs{display:flex;gap:2px}
.tabs button{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;color:#9DAB9C;
  font:500 13px/1 "Oswald",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:11px 4px 9px;cursor:pointer
}
.tabs button[aria-selected="true"]{color:#FCFCFA;border-bottom-color:#8FBF6A}

/* ---------- фильтры ---------- */
.filters{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.chiprow{display:flex;gap:6px;padding:9px var(--pad);overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow+.chiprow{padding-top:0}
.chip{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F3F5EF}
.chip .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-right:5px}
.chip[aria-pressed="true"] .lbl{color:#94A392}

main{padding:12px var(--pad) 0}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 10px}

/* ---------- карточка вида работ ---------- */
.op{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.op>summary{list-style:none;cursor:pointer;padding:12px 13px;display:block}
.op>summary::-webkit-details-marker{display:none}
.op-l1{display:flex;align-items:flex-start;gap:9px}
.op-name{flex:1;font:500 16px/1.25 "Oswald",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.op-pct{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px}
.s-done{background:var(--leaf)} .s-ok{background:#7BA23F} .s-warn{background:var(--straw)} .s-risk{background:var(--clay)}
.c-done{color:var(--leaf)} .c-ok{color:#5C8C2F} .c-warn{color:var(--straw)} .c-risk{color:var(--clay)}

/* СИГНАТУРА: полоса выполнения нарисована как обработанное поле — гоны по вспашке */
.field{position:relative;height:13px;border-radius:3px;margin:9px 0 7px;overflow:hidden;
  background:repeating-linear-gradient(135deg,#E4E7DD 0 5px,#EDEFE7 5px 10px);border:1px solid var(--line)}
.field i{position:absolute;inset:0 auto 0 0;display:block;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 6px);
  background-color:currentColor}
.f-done i,.f-ok i{color:#3F7D42} .f-warn i{color:#C08A15} .f-risk i{color:#A63D28}
.op-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.op-meta b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}

/* детализация */
.detail{border-top:1px dashed var(--line);padding:4px 13px 12px}
.item{padding:9px 0;border-bottom:1px solid #EFF1EA}
.item:last-child{border-bottom:0}
.item-h{display:flex;gap:8px;align-items:baseline}
.item-h .t{flex:1;font-size:14px;line-height:1.3}
.item-h .t em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.tagfarm{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.spark{display:flex;align-items:flex-end;gap:1.5px;height:26px;margin-top:7px}
.spark span{flex:1;min-width:2px;background:#C3CDBC;border-radius:1px 1px 0 0}
.spark span.hot{background:#5C8C2F}

/* ---------- вкладка «По дням» ---------- */
.daybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;text-align:center;cursor:pointer;min-width:60px}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F3F5EF}
.day small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.day[aria-pressed="true"] small{color:#9DAB9C}
.day b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:2px 0 14px;
  padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bars span{flex:1;background:#B9C6B2;border-radius:2px 2px 0 0;min-height:2px;cursor:pointer}
.bars span.sel{background:var(--ink)}
.row{display:flex;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:7px}
.row .t{flex:1;font-size:14px}
.row .t small{display:block;color:var(--mute);font-size:12px}
.row .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}

/* ---------- вкладка «Сроки» ---------- */
.gantt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:7px}
.gantt .g-h{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.track{position:relative;height:8px;background:#EDEFE7;border-radius:4px;margin:5px 0}
.track i{position:absolute;top:0;bottom:0;border-radius:4px;display:block}
.tr-plan i{background:#C3CDBC}
.tr-fact i{background:#4B7F3E}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-bottom:10px}
.legend s{text-decoration:none;display:inline-block;width:16px;height:7px;border-radius:4px;vertical-align:middle;margin-right:5px}
.dates{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.dates b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500}

/* ---------- низ ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(232,234,227,0),var(--paper) 34%)}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;
  background:var(--ink);color:#F3F5EF;border:0;border-radius:11px;padding:13px;cursor:pointer;
  font:500 13px/1 "Oswald",sans-serif;letter-spacing:.07em;text-transform:uppercase}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:0 0 46%}
footer{color:var(--mute);font-size:11.5px;text-align:center;padding:16px 0 6px}
.empty{color:var(--mute);text-align:center;padding:34px 10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.op[open] .detail{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid #8FBF6A;outline-offset:2px}
</style>
</head>

<script>
const RU_MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const RU_DOW = ['вс','пн','вт','ср','чт','пт','сб'];
const fmt   = n => (n||0).toLocaleString('ru-RU', {maximumFractionDigits:0});
const dShort= s => {const d=new Date(s); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`};
const dLong = s => s ? `${String(new Date(s).getDate()).padStart(2,'0')} ${RU_MON[new Date(s).getMonth()]}` : '—';
const dow   = s => RU_DOW[new Date(s).getDay()];

let DATA = null;
const S = {tab:'svod', farm:null, culture:null, op:null, day:null, cum:false};

/* --- состояние живёт в адресе страницы: срез можно переслать ссылкой --- */
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  for (const k of ['tab','farm','culture','op','day']) if (q.get(k)) S[k] = q.get(k);
  S.cum = q.get('cum') === '1';
}
function writeHash(){
  const q = new URLSearchParams();
  q.set('tab', S.tab);
  if (S.farm) q.set('farm', S.farm);
  if (S.culture) q.set('culture', S.culture);
  if (S.op) q.set('op', S.op);
  if (S.day) q.set('day', S.day);
  if (S.cum) q.set('cum','1');
  history.replaceState(null,'','#'+q.toString());
}

/* --- срез: пересчитываем виды работ под выбранные предприятие и культуру --- */
function slice(){
  return DATA.ops.map(op => {
    const items = op.items.filter(i =>
      (!S.farm || i.farm === S.farm) && (!S.culture || i.culture === S.culture));
    if (!items.length) return null;
    const plan = items.reduce((s,i)=>s+i.plan,0);
    const fact = items.reduce((s,i)=>s+i.fact,0);
    const daily = {};
    items.forEach(i => Object.entries(i.daily).forEach(([d,v]) => daily[d]=(daily[d]||0)+v));
    const pct = plan ? +(fact/plan*100).toFixed(1) : 0;
    return {...op, items, plan, fact, daily, pct, left:Math.max(plan-fact,0), status:status(pct)};
  }).filter(Boolean).sort((a,b)=>b.plan-a.plan);
}
const status = p => p>=99.5?'done':p>=70?'ok':p>=35?'warn':'risk';

function kpi(ops){
  const plan = ops.reduce((s,o)=>s+o.plan,0), fact = ops.reduce((s,o)=>s+o.fact,0);
  const byDay = {};
  ops.forEach(o=>Object.entries(o.daily).forEach(([d,v])=>byDay[d]=(byDay[d]||0)+v));
  const days = Object.keys(byDay).sort();
  const last = days[days.length-1];
  const week = days.slice(-7).reduce((s,d)=>s+byDay[d],0);
  return {plan, fact, left:Math.max(plan-fact,0), pct: plan?fact/plan*100:0,
          last, lastFact: byDay[last]||0, week, tempo: week/Math.max(days.slice(-7).length,1), byDay, days};
}

function renderHeader(k){
  document.getElementById('ttl').textContent = `Полевые работы ${DATA.meta.season}`;
  document.getElementById('asof').textContent = 'на ' + dLong(DATA.meta.reportDate);
  document.getElementById('kpi').innerHTML = `
    <div><b>${k.pct.toFixed(0)}%</b><span>выполнено</span></div>
    <div><b>${fmt(k.fact)}</b><span>факт, га</span></div>
    <div><b>${fmt(k.plan)}</b><span>план, га</span></div>
    <div><b>${fmt(k.left)}</b><span>остаток, га</span></div>
    <div><b>${fmt(k.lastFact)}</b><span>за ${dShort(k.last||DATA.meta.reportDate)}</span></div>
    <div><b>${fmt(k.tempo)}</b><span>темп, га/сут</span></div>`;
}

function chips(box, label, values, key){
  box.innerHTML = [`<button class="chip" data-v="" aria-pressed="${!S[key]}"><span class="lbl">${label}</span>все</button>`]
    .concat(values.map(v=>`<button class="chip" data-v="${esc(v)}" aria-pressed="${S[key]===v}">${esc(v)}</button>`)).join('');
  box.onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    S[key] = b.dataset.v || null; S.op = null; render();
  };
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= вкладка «Сводка» ================= */
function viewSvod(ops){
  if (!ops.length) return `<p class="empty">По этому срезу работ нет.<br>Снимите один из фильтров.</p>`;
  return `<p class="hint">Нажмите на вид работ — раскроется по культурам и предприятиям.</p>` +
    ops.map(o => `
      <details class="op" ${S.op===o.id?'open':''} data-op="${o.id}">
        <summary>
          <div class="op-l1">
            <span class="dot s-${o.status}"></span>
            <span class="op-name">${esc(o.name)}</span>
            <span class="op-pct c-${o.status}">${o.pct.toFixed(0)}%</span>
          </div>
          <div class="field f-${o.status}"><i style="width:${Math.min(o.pct,100)}%"></i></div>
          <div class="op-meta">
            <span>факт <b>${fmt(o.fact)}</b> га</span>
            <span>план <b>${fmt(o.plan)}</b> га</span>
            <span>остаток <b>${fmt(o.left)}</b> га</span>
          </div>
        </summary>
        <div class="detail">${o.items.slice().sort((a,b)=>b.plan-a.plan).map(item).join('')}</div>
      </details>`).join('');
}

function item(i){
  const days = Object.keys(i.daily).sort();
  const max = Math.max(...Object.values(i.daily), 1);
  const spark = days.length ? `<div class="spark">${days.slice(-24).map(d =>
      `<span class="${d===DATA.meta.reportDate?'hot':''}" style="height:${Math.max(i.daily[d]/max*100,6)}%" title="${dShort(d)}: ${fmt(i.daily[d])} га"></span>`).join('')}</div>` : '';
  return `<div class="item">
    <div class="item-h">
      <span class="t">${esc(i.culture)}${i.sub?`<em>${esc(i.sub)}</em>`:''}</span>
      <span class="tagfarm">${esc(i.farm)}</span>
      <span class="op-pct c-${i.status}" style="font-size:14px">${i.pct.toFixed(0)}%</span>
    </div>
    <div class="field f-${i.status}"><i style="width:${Math.min(i.pct,100)}%"></i></div>
    <div class="op-meta"><span>факт <b>${fmt(i.fact)}</b></span><span>план <b>${fmt(i.plan)}</b></span>
      <span>остаток <b>${fmt(i.left)}</b></span><span>начали <b>${dLong(i.factStart)}</b></span></div>
    ${spark}</div>`;
}

/* ================= вкладка «По дням» ================= */
function viewDays(ops, k){
  const days = k.days;
  if (!days.length) return `<p class="empty">По этому срезу выработки нет.</p>`;
  if (!S.day || !days.includes(S.day)) S.day = days[days.length-1];
  const tail = days.slice(-21);
  const max = Math.max(...tail.map(d=>k.byDay[d]), 1);

  const bars = `<div class="bars">${tail.map(d =>
    `<span class="${d===S.day?'sel':''}" data-day="${d}" style="height:${Math.max(k.byDay[d]/max*100,3)}%" title="${dShort(d)}: ${fmt(k.byDay[d])} га"></span>`).join('')}</div>`;

  const chipsDays = `<div class="daybar">${tail.slice().reverse().map(d =>
    `<button class="day" data-day="${d}" aria-pressed="${d===S.day}"><small>${dow(d)} ${dShort(d)}</small><b>${fmt(k.byDay[d])}</b></button>`).join('')}</div>`;

  // строки: за выбранный день или нарастающим итогом с начала сезона по этот день
  const rows = [];
  ops.forEach(o => o.items.forEach(i => {
    const v = S.cum
      ? Object.entries(i.daily).reduce((s,[d,x]) => d<=S.day ? s+x : s, 0)
      : (i.daily[S.day] || 0);
    if (v > 0) rows.push({op:o.name, i, v});
  }));
  rows.sort((a,b)=>b.v-a.v);
  const sum = rows.reduce((s,r)=>s+r.v,0);

  return `
    <div class="chiprow" style="padding:0 0 10px">
      <button class="chip" data-cum="0" aria-pressed="${!S.cum}">За день</button>
      <button class="chip" data-cum="1" aria-pressed="${S.cum}">Накопительно</button>
    </div>
    <p class="hint">Столбик или карточку дня можно нажать — список внизу перестроится.</p>
    ${bars}${chipsDays}
    <div class="row" style="background:var(--ink);color:#F3F5EF;border-color:var(--ink)">
      <span class="t">${S.cum ? 'Нарастающим итогом по '+dLong(S.day) : 'Итого за '+dow(S.day)+' '+dLong(S.day)}</span>
      <span class="v">${fmt(sum)} га</span>
    </div>
    ${rows.length ? rows.map(r => `<div class="row">
        <span class="t">${esc(r.op)}<small>${esc(r.i.culture)} · ${esc(r.i.farm)}${r.i.sub?' · '+esc(r.i.sub):''}</small></span>
        <span class="v">${fmt(r.v)}</span></div>`).join('')
      : `<p class="empty">В этот день работ по срезу не было.</p>`}`;
}

/* ================= вкладка «Сроки» ================= */
function viewTerms(ops){
  const all = [];
  ops.forEach(o => o.items.forEach(i => {
    const ds = [i.planStart, i.planEnd, i.factStart, i.factEnd].filter(Boolean);
    if (ds.length) all.push(...ds.map(d => +new Date(d)));
  }));
  if (!all.length) return `<p class="empty">Сроки по этому срезу не заданы.</p>`;
  const min = Math.min(...all), max = Math.max(...all, +new Date(DATA.meta.reportDate));
  const pos = d => ((+new Date(d) - min) / Math.max(max - min, 1)) * 100;

  return `<div class="legend"><span><s style="background:#C3CDBC"></s>план</span>
      <span><s style="background:#4B7F3E"></s>факт</span>
      <span>шкала ${dLong(new Date(min).toISOString().slice(0,10))} — ${dLong(new Date(max).toISOString().slice(0,10))}</span></div>` +
    ops.map(o => `<div class="gantt">
      <div class="g-h"><span class="dot s-${o.status}" style="margin-top:5px"></span>
        <span class="op-name" style="flex:1">${esc(o.name)}</span>
        <span class="op-pct c-${o.status}" style="font-size:15px">${o.pct.toFixed(0)}%</span></div>
      ${o.items.slice().sort((a,b)=>b.plan-a.plan).map(i => {
        const ps=i.planStart, pe=i.planEnd||i.planStart, fs=i.factStart, fe=i.factEnd||DATA.meta.reportDate;
        const late = ps && fs && new Date(fs) > new Date(ps);
        return `<div style="margin:9px 0 0">
          <div class="item-h"><span class="t">${esc(i.culture)}<em>${esc(i.farm)}${i.sub?' · '+esc(i.sub):''}</em></span>
            ${late?'<span class="tagfarm" style="color:var(--clay);border-color:var(--clay)">позже плана</span>':''}</div>
          ${ps?`<div class="track tr-plan"><i style="left:${pos(ps)}%;width:${Math.max(pos(pe)-pos(ps),1.5)}%"></i></div>`:''}
          ${fs?`<div class="track tr-fact"><i style="left:${pos(fs)}%;width:${Math.max(pos(fe)-pos(fs),1.5)}%"></i></div>`:''}
          <div class="dates">
            <span>план ${ps ? `<b>${dLong(ps)} — ${dLong(i.planEnd)||'—'}</b>` : 'агросрок не задан'}</span>
            <span>факт ${fs ? `<b>${dLong(fs)} — ${i.factEnd ? dLong(i.factEnd) : 'в работе'}</b>` : 'не начинали'}</span>
          </div></div>`;
      }).join('')}</div>`).join('');
}

/* ================= сборка ================= */
function render(){
  const ops = slice();
  const k = kpi(ops);
  renderHeader(k);
  chips(document.getElementById('f-farm'), 'Предприятие', DATA.farms, 'farm');
  chips(document.getElementById('f-culture'), 'Культура', DATA.cultures, 'culture');
  document.querySelectorAll('.tabs button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === S.tab));

  const view = document.getElementById('view');
  view.innerHTML = S.tab === 'svod' ? viewSvod(ops)
                 : S.tab === 'days' ? viewDays(ops, k)
                 : viewTerms(ops);

  view.querySelectorAll('.op').forEach(d => d.addEventListener('toggle', () => {
    S.op = d.open ? d.dataset.op : (S.op === d.dataset.op ? null : S.op); writeHash();
  }));
  view.querySelectorAll('[data-day]').forEach(el => el.onclick = () => { S.day = el.dataset.day; render(); });
  view.querySelectorAll('[data-cum]').forEach(el => el.onclick = () => { S.cum = el.dataset.cum === '1'; render(); });

  document.getElementById('foot').textContent =
    `Источник: ${DATA.meta.source} · обновлено ${DATA.meta.generatedAt.replace('T',' ')}`;
  writeHash();
}

document.querySelectorAll('.tabs button').forEach(b =>
  b.onclick = () => { S.tab = b.dataset.tab; render(); });
document.getElementById('reset').onclick = () => {
  S.farm = S.culture = S.op = null; S.cum = false; render();
};

readHash();
/* автономная версия: данные вшиты в файл, интернет не нужен */
const emb = document.getElementById('embedded');
if (emb) { DATA = JSON.parse(emb.textContent); render(); }
else fetch('data.json?v=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { DATA = d; render(); })
  .catch(e => {
    document.getElementById('view').innerHTML =
      `<p class="empty">Данные не загрузились (${e}).<br>Отчёт собирается автоматически после загрузки свода в репозиторий.</p>`;
  });
</script>
</body>
</html>
